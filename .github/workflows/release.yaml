name: Release Flutter APK, Windows, and Linux AppImage

on:
  push:
    tags:
      - '*'

jobs:
  build_apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1

  build_windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Enable Windows Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release --verbose

      - name: Zip Windows Files
        run: |
          $VERSION="${{ github.ref_name }}" 
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "windows-x86_64-${VERSION}.zip"
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: windows-x86_64-${{ github.ref_name }}.zip

  build_linux:
    name: Build Linux App & AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git unzip xz-utils zip libglu1-mesa \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            appimage-builder fuse libfuse2

      - name: Enable Linux Support
        run: flutter config --enable-linux-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Linux App
        run: flutter build linux --release --verbose

      - name: Create AppImage
        run: |
          VERSION="${{ github.ref_name }}" 
          mkdir -p AppDir
          cp -r build/linux/x64/release/bundle/* AppDir/
          appimage-builder --recipe appimage-builder.yml
          mv *.AppImage linux-x86_64-${VERSION}.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            linux-x86_64-${{ github.ref_name }}.AppImage

  release:
    name: Create GitHub Release
    needs: [build_apk, build_windows, build_linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts

      - name: Download Windows App from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts

      - name: Download Linux AppImage from Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/app-release.apk.sha1
            artifacts/windows-x86_64-${{ github.ref_name }}.zip
            artifacts/linux-x86_64-${{ github.ref_name }}.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
